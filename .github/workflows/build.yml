# Compiles and tests yewclic on a real Mac for every pull request and every
# push to main/yewclic/stable, so a change that breaks the app shows a red ❌
# before it's merged. (The weekly Clicky-port routine runs on Linux and can't
# compile this app, so it relies on this check.)
name: Build

on:
  pull_request:
  push:
    branches: [main, yewclic, stable]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Show Swift version
        run: swift --version
      - name: Run unit tests
        run: scripts/test.sh
      - name: Build release app bundle
        run: scripts/build-app.sh
      - name: Render the welcome guide
        # Draws every onboarding step (light and dark) so reviewers can see
        # UI changes without building locally.
        continue-on-error: true
        run: build/Yewclic.app/Contents/MacOS/Yewclic --snapshot-onboarding "$RUNNER_TEMP/onboarding"
      - name: Upload welcome guide screenshots
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: onboarding-screenshots
          path: ${{ runner.temp }}/onboarding
          if-no-files-found: ignore
